<html lang="zh-CN">

<style>
*{box-sizing:border-box}
:root{--blue:#3883fa;--ink:#30394a;--muted:#59697c;--line:#e5e8ec;--surface:#fff;--page:#f8f9fa}
body{margin:0;font:13px/1.5 -apple-system,"Noto Sans","Helvetica Neue",Helvetica,Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--page)}
/* ZUI default theme: white application strip and blue module navigation. */
.apps-bar{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.apps-bar strong{font-size:15px}.apps-bar span{color:var(--muted)}
header{background:var(--blue);color:#fff;display:flex;align-items:center;gap:15px;padding:0 16px;height:40px}
header strong{font-size:15px;align-self:stretch;display:grid;align-items:center;border-bottom:2px solid #cce0ff}
header button{color:#fff;background:transparent;border:0;padding-inline:8px}header button:hover{background:#ffffff24}
main{max-width:1440px;margin:auto;padding:10px 12px 70px}
h1,h2{margin:0}h1{font-size:18px}h2{font-size:14px}p{margin:10px 0}.bar,.filters,.actions,.feature{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar,.feature{justify-content:space-between;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:8px}
.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button,input,select,textarea{font:inherit;min-height:32px;border:1px solid #d4dae3;border-radius:4px;padding:4px 10px;background:#fff;color:inherit}button{cursor:pointer}button:hover{filter:brightness(.96)}.link{border:0;background:transparent;color:#1b6de2;text-align:left;padding:3px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:8px 10px;text-align:left;border-bottom:1px solid #e7edf4}th{background:#f1f3f5;color:var(--ink);font-weight:600}tbody tr:hover{background:#f5f9ff}.pill{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ffad32}.pill[data-state="跟进中"]::before{background:var(--blue)}.pill[data-state="已关闭"]::before{background:#97a1b1}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(235px,1fr);gap:12px}.browse{display:grid;grid-template-columns:205px minmax(0,1fr);gap:12px}.browse .panel{min-width:0}.tree button{display:block;width:100%;text-align:left;margin-top:5px;border-color:transparent}.tree [aria-pressed=true]{background:#eaf2ff;color:#1b6de2}.tree .child{padding-left:23px}.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent}.tabs button[aria-pressed=true]{color:#1b6de2;border-bottom-color:var(--blue);font-weight:600}.count{padding:10px}.record-title{justify-content:flex-start}.section{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}.section:last-child{border:0;margin:0}.detail-tabs{border-bottom:1px solid var(--line);margin-bottom:13px}
dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:10px}dt{color:var(--muted)}dd{margin:0}
.dock{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#151a23d9;color:#fff;border-radius:4px;padding:5px;backdrop-filter:blur(8px);box-shadow:0 4px 12px #26354840}.dock button,.dock summary{background:transparent;color:inherit;border:0;padding:6px 9px;cursor:pointer}.dock button:hover,.dock summary:hover{background:#3c4d62}.dock details{position:relative}.dock-menu{position:absolute;right:0;bottom:calc(100% + 9px);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:5px;min-width:145px;box-shadow:0 5px 15px #26354830}.dock-menu button{display:block;text-align:left;width:100%}.dock-menu button:hover{background:#eaf2ff}
dialog{border:1px solid #c5d1e0;border-radius:4px;width:min(640px,94vw);max-height:90vh;padding:0}dialog::backdrop{background:#26354870}dialog h2{padding:10px 16px;border-bottom:1px solid var(--line);font-size:16px}
dialog #fields,dialog #error{padding-inline:16px}
dialog form>.actions{margin:10px 0 0;border-top:1px solid var(--line);padding:9px 16px}
label{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start;margin:7px 0;min-width:0}
label span{text-align:right;padding-top:6px}
label input,label select,label textarea{width:100%;min-width:0}
label b{color:#df3444;font-weight:400}textarea{min-height:80px;resize:vertical}form .actions{justify-content:flex-end;margin-top:15px}#notice:not(:empty){padding:6px 10px;background:#e8f6ef;color:#17573d;margin-bottom:9px}#error{color:#9d261a}.editor{max-width:1000px;margin:0 auto;padding:16px 20px}.editor h1{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}.editor .actions{justify-content:flex-start;margin-left:98px}.form-group{border:0;border-bottom:1px solid var(--line);margin:0 0 15px;padding:0 0 12px;min-width:0}.form-group legend{font-weight:650}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}
@media(max-width:720px){.grid,.browse,.form-grid{grid-template-columns:1fr}.tree button{display:inline-block;width:auto}.dock{justify-content:center}main{padding-inline:10px}}
.picker{position:relative;min-width:0}
.picker-toggle{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.picker-toggle::after{content:"▾";color:var(--muted)}
.picker select{position:absolute;width:1px;height:1px;min-height:0;opacity:0;pointer-events:none}
.picker-menu{position:absolute;top:calc(100% + 3px);left:0;right:0;min-width:150px;z-index:6;background:white;border:1px solid var(--line);border-radius:4px;padding:6px;box-shadow:0 4px 12px #26354825}
.picker-menu input{width:100%}.picker-options{max-height:145px;overflow:auto;margin-top:5px}
.picker-options button{display:block;width:100%;text-align:left;border:0}.picker-options button:hover,.picker-options button:focus-visible{background:#eaf2ff}
.picker-options p{margin:5px;color:var(--muted)}
</style>
<div class="apps-bar"><strong>禅道</strong><span>交互原型 · 模拟数据</span></div>
<header><strong>许愿池</strong><button type="button" id="poolNav">许愿列表</button></header>
<main><div id="notice" role="status"></div><div id="app"></div></main>
<dialog id="dialog"><form id="form"><h2 id="dialogTitle"></h2><div id="fields"></div><div id="error" role="alert"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="confirm">保存</button></div></form></dialog>
<script>
const app=document.querySelector('#app'), dialog=document.querySelector('#dialog'), form=document.querySelector('#form'), notice=document.querySelector('#notice');
const products={'库存管理':'王晓','客户服务':'陈晨'};
const modules={'库存管理':['库存查询','库存导出'],'客户服务':['工单处理','客户档案']};
const builds={'库存管理':{'trunk':'trunk（主干）','21':'库存管理 22.7 测试构建'},'客户服务':{'trunk':'trunk（主干）','22':'客户服务 22.7 测试构建'}};
const targets=['反馈','Bug','工单','待办','需求','任务'];
const states=['待评估','跟进中','已关闭'];
const closeReasons={done:'已完成',duplicate:'重复',postponed:'延期',willnotdo:'不做',cancel:'已取消',bydesign:'设计如此'};
const people=['王晓','陈晨','林然'];
// Illustrative copies of the native story dictionaries for this offline prototype.
const storySources={customer:'客户',user:'用户',po:'产品经理',market:'市场',service:'客服',operation:'运营',support:'技术支持',competitor:'竞争对手',partner:'合作伙伴',dev:'开发人员',tester:'测试人员',bug:'Bug',forum:'论坛',other:'其他'};
const storyCategories={feature:'功能',interface:'接口',performance:'性能',safe:'安全',experience:'体验',improve:'改进',other:'其他'};
const storyPriorities={'1':'1','2':'2','3':'3','4':'4'};
const currentUser='林然';
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});
const wishes=[
 {id:104,module:'库存导出',title:'库存导出支持按仓库筛选',product:'库存管理',customer:'华东仓储',source:'customer',sourceNote:'客户拜访',desc:'导出库存时，希望先选择仓库，以便仓库主管查看各自的数据。',verify:'导出结果仅包含所选仓库的库存。',owner:'王晓',reporter:'林然',priority:'1',category:'feature',status:'待评估',date:'2026-11-20',links:{},history:['林然登记了许愿']},
 {id:103,module:'工单处理',title:'工单详情展示最近一次答复',product:'客户服务',customer:'南区服务团队',source:'service',sourceNote:'群聊',desc:'客服接手工单时需要快速看到上一位同事的答复。',verify:'详情中能看到最近答复和时间。',owner:'林然',reporter:'陈晨',priority:'2',category:'experience',status:'跟进中',date:'2026-11-19',links:{需求:{id:62,title:'工单详情展示最近一次答复'}},history:['陈晨创建了研发需求 #62']},
 {id:102,module:'库存查询',title:'库存列表默认显示可用数量',product:'库存管理',customer:'北区仓储',source:'customer',sourceNote:'电话',desc:'希望进页面即可看到可用库存。',verify:'默认列包含可用库存。',owner:'王晓',reporter:'林然',priority:'3',category:'improve',status:'已关闭',date:'2026-11-18',closure:{reason:'done',comment:'已指导开启可用库存列，客户确认。',by:'王晓',date:'2026-11-18'},links:{},history:['王晓记录答复并关闭许愿']}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='全部', filters={product:'',module:'',status:'',search:''}, nextTarget=200;
const options=(values,selected='')=>values.map(v=>'<option'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('');
function list(){
 const tree=(product='',module='')=>'<button type="button" data-product="'+product+'" data-module="'+module+'" class="'+(module?'child':'')+'" aria-pressed="'+(filters.product===product&&filters.module===module)+'">'+(module||product||'所有产品')+'</button>';
 app.innerHTML=
  '<div class="feature"><div class="actions tabs">'+['全部','我提交的','待我处理'].map(t=>'<button data-tab="'+t+'" aria-pressed="'+(tab===t)+'">'+t+'</button>').join('')+'<button id="toggleSearch" aria-expanded="false">搜索</button></div><button class="primary" id="new">＋ 提交许愿</button></div>'+
  '<div class="browse"><aside class="panel tree"><h2>产品模块</h2>'+tree()+Object.keys(products).map(product=>tree(product)+modules[product].map(module=>tree(product,module)).join('')).join('')+'</aside>'+
  '<section class="panel"><div id="searchPanel" hidden><div class="filters"><select aria-label="状态" id="statusFilter"><option value="">所有状态</option>'+options(states,filters.status)+'</select><input aria-label="搜索" id="search" placeholder="编号、标题、客户" value="'+esc(filters.search)+'"><button id="apply">筛选</button><button id="clear">清除</button></div></div><div class="scroll"><table><thead><tr><th>编号</th><th>优先级</th><th>标题</th><th>产品</th><th>客户</th><th>状态</th><th>负责人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="count" class="muted count"></div></section></div>';
 const rows=wishes.filter(w=>(tab==='全部'||(tab==='我提交的'?w.reporter===currentUser:w.owner===currentUser&&w.status!=='已关闭'))&&(!filters.product||w.product===filters.product)&&(!filters.module||w.module===filters.module)&&(!filters.status||w.status===filters.status)&&(w.id+' '+w.title+' '+w.customer).includes(filters.search));
 app.querySelector('#rows').innerHTML=rows.map(w=>'<tr><td>'+w.id+'</td><td>'+esc(w.priority)+'</td><td><button class="link" data-id="'+w.id+'">'+esc(w.title)+'</button></td><td>'+esc(w.product)+'</td><td>'+esc(w.customer)+'</td><td><span class="pill" data-state="'+w.status+'">'+w.status+'</span></td><td>'+esc(w.owner)+'</td><td>'+w.date+'</td><td><button class="link" data-edit="'+w.id+'" aria-label="编辑许愿 '+w.id+'">编辑</button></td></tr>').join('')||'<tr><td colspan="9">没有符合条件的许愿</td></tr>';
 app.querySelector('#count').textContent='共 '+rows.length+' 条许愿';
 const searchToggle=app.querySelector('#toggleSearch');
 const searchPanel=app.querySelector('#searchPanel');
 const toggle=open=>{searchPanel.hidden=!open;searchToggle.setAttribute('aria-expanded',String(open))};
 toggle(Boolean(filters.search||filters.status));
 searchToggle.onclick=()=>toggle(searchPanel.hidden);
 app.querySelector('#new').onclick=()=>wishForm();
 app.querySelector('#apply').onclick=()=>{filters.status=app.querySelector('#statusFilter').value;filters.search=app.querySelector('#search').value.trim();list()};
 app.querySelector('#clear').onclick=()=>{filters.status='';filters.search='';list()};
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;list()});
 app.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{filters.product=b.dataset.product;filters.module=b.dataset.module;list()});
 app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(wishes.find(w=>w.id===Number(b.dataset.id))));
 app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wishForm(wishes.find(w=>w.id===Number(b.dataset.edit)),list));
}
function detail(w, active='基本信息'){
 const closed=w.status==='已关闭';
 const closure=w.closure;
 const duplicate=wishes.find(item=>item.id===closure?.duplicateID);
 const closureText=closure?[closeReasons[closure.reason],duplicate?'重复于 #'+duplicate.id+' '+duplicate.title:'',closure.by+' · '+closure.date,closure.comment].filter(Boolean).join(' ｜ '):'';
 const fields=Object.entries({'产品':w.product,'所属模块':w.module,'客户':w.customer,'来源':storySources[w.source],'来源备注':w.sourceNote,'类别':storyCategories[w.category],'优先级':w.priority,'提报人':w.reporter,'指派给':closed?'已关闭':w.owner});
 const related=targets.filter(t=>w.links[t]).map(t=>'<p><button class="link" data-related="'+t+'">'+t+' #'+w.links[t].id+' · '+esc(w.links[t].title)+'</button></p>').join('');
 const section=(heading,body)=>'<div class="section"><h2>'+heading+'</h2>'+body+'</div>';
 const description=(heading,value)=>section(heading,'<p>'+esc(value)+'</p>');
 app.innerHTML='<div class="bar record-title"><button class="link" id="back">← 返回许愿列表</button><span class="muted">#'+w.id+'</span><h1>'+esc(w.title)+'</h1><span class="pill" data-state="'+w.status+'">'+w.status+'</span></div>'+
  '<div class="grid"><section class="panel">'+description('许愿描述',w.desc||'暂无描述')+description('验收标准',w.verify||'待补充')+(closure?description('关闭记录',closureText):'')+section('历史记录',w.history.map(h=>'<p>'+esc(h)+'</p>').join(''))+'</section>'+
  '<aside><section class="panel"><div class="actions tabs detail-tabs">'+['基本信息','承接单据'].map(t=>'<button data-detail-tab="'+t+'" aria-pressed="'+(t===active)+'">'+t+(t==='承接单据'?' ('+Object.keys(w.links).length+')':'')+'</button>').join('')+'</div>'+
  (active==='基本信息'?'<dl>'+fields.map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v||'—')+'</dd>').join('')+'</dl>':related||'<p class="muted">暂无承接单据</p>')+'</section></aside></div>'+
  '<div class="actions dock" aria-label="许愿操作"><button id="dockBack">返回</button>'+(closed?'<button data-action="重开">激活</button>':'<button data-action="编辑">编辑</button><button data-action="转交">指派</button><button data-action="关闭">关闭</button><details><summary>转单</summary><div class="dock-menu">'+targets.map(t=>'<button data-target="'+t+'">'+(w.links[t]?'查看':'转')+t+'</button>').join('')+'</div></details>')+'</div>';
 app.querySelector('#back').onclick=list;
 app.querySelector('#dockBack').onclick=list;
 app.querySelectorAll('[data-detail-tab]').forEach(b=>b.onclick=()=>detail(w,b.dataset.detailTab));
 app.querySelectorAll('[data-target],[data-related]').forEach(b=>b.onclick=()=>{
  const menu=b.closest('details');if(menu)menu.open=false;
  conversion(w,b.dataset.target||b.dataset.related);
 });
 app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handle(w,b.dataset.action));
}
const fieldLabel=(label,required)=>'<span>'+label+(required?' <b aria-hidden="true">*</b>':'')+'</span>';
const input=(label,name,value='',required=false,type='text')=>'<label>'+fieldLabel(label,required)+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(required?'required':'')+'></label>';
const area=(label,name,value='',required=false)=>'<label>'+fieldLabel(label,required)+'<textarea name="'+name+'" '+(required?'required':'')+'>'+esc(value)+'</textarea></label>';
function optionMarkup(values,selected=''){
 const entries=Array.isArray(values)?values.map(value=>[value,value]):Object.entries(values);
 return '<option value="">请选择</option>'+entries.map(([value,label])=>'<option value="'+esc(value)+'"'+(String(value)===selected?' selected':'')+'>'+esc(label)+'</option>').join('');
}
function picker(label,name,markup,required=false){
 return '<div class="picker-field"><div class="picker" data-label="'+esc(label)+'">'+
  '<label>'+fieldLabel(label,required)+'<button class="picker-toggle" type="button" aria-expanded="false"></button></label>'+
  '<select name="'+name+'" aria-label="'+esc(label)+'" tabindex="-1" '+(required?'required':'')+'>'+markup+'</select>'+
  '<div class="picker-menu" hidden><input type="search" aria-label="搜索'+esc(label)+'" placeholder="输入名称或编号"><div class="picker-options"></div></div></div></div>';
}
const select=(label,name,values,value='',required=false)=>picker(label,name,optionMarkup(values,value),required);
function initPickers(root){
 root.querySelectorAll('.picker').forEach(p=>{
  const field=p.querySelector('select'), toggle=p.querySelector('.picker-toggle');
  const menu=p.querySelector('.picker-menu'), search=menu.querySelector('input'), results=menu.querySelector('.picker-options');
  const render=()=>{
   const query=search.value.trim().toLocaleLowerCase();
   const matches=Array.from(field.options).filter(o=>!query||o.text.toLocaleLowerCase().includes(query)||o.value.toLocaleLowerCase().includes(query));
   results.replaceChildren();
   matches.forEach(option=>{
    const button=document.createElement('button');
    button.type='button';button.textContent=option.text;
    button.onclick=()=>{
     field.value=option.value;
     field.dispatchEvent(new Event('change',{bubbles:true}));
     close();toggle.focus();
    };
    results.append(button);
   });
   if(!matches.length){const empty=document.createElement('p');empty.textContent='无匹配选项';results.append(empty)}
  };
  const refresh=()=>{toggle.textContent=field.selectedOptions[0]?.text||'请选择';if(!menu.hidden)render()};
  const close=()=>{menu.hidden=true;toggle.setAttribute('aria-expanded','false')};
  const open=()=>{
   menu.hidden=false;toggle.setAttribute('aria-expanded','true');search.value='';render();search.focus();
  };
  toggle.onclick=()=>menu.hidden?open():close();
  search.oninput=render;
  p.onkeydown=e=>{
   if(e.key==='Escape'&&!menu.hidden){e.preventDefault();e.stopPropagation();close();toggle.focus()}
   if(e.key==='ArrowDown'&&e.target===search){e.preventDefault();results.querySelector('button')?.focus()}
   if(e.key==='Enter'&&e.target===search){e.preventDefault();results.querySelector('button')?.click()}
  };
  p.onfocusout=e=>{if(!p.contains(e.relatedTarget))close()};
  field.addEventListener('change',refresh);
  field.addEventListener('invalid',e=>{e.preventDefault();if(menu.hidden)open()});
  refresh();
 });
}
function setOptions(field,values){
 field.innerHTML=optionMarkup(values);
 field.dispatchEvent(new Event('change',{bubbles:true}));
}
function modal(title,fields,save,action='保存'){
 document.querySelector('#dialogTitle').textContent=title;
 document.querySelector('#fields').innerHTML=fields;
 initPickers(form);
 document.querySelector('#confirm').textContent=action;
 document.querySelector('#error').textContent='';
 form.onsubmit=e=>{e.preventDefault();const failure=save(Object.fromEntries(new FormData(form)));if(failure)document.querySelector('#error').textContent=failure;else dialog.close()};
 dialog.showModal();
}
document.querySelector('#cancel').onclick=()=>dialog.close();
function wishForm(w, back=()=>w?detail(w):list()){
 const group=(title,fields)=>'<fieldset class="form-group"><legend>'+title+'</legend><div class="form-grid">'+fields+'</div></fieldset>';
 const full=html=>'<div class="full">'+html+'</div>';
 app.innerHTML='<section class="panel editor"><h1>'+(w?'编辑许愿':'提交许愿')+'</h1><form id="wishForm">'+
  group('所属范围',select('所属产品','product',Object.keys(products),w?.product,true)+select('所属模块','module',modules[w?.product]||[],w?.module)+full('<p id="assignee" class="muted"></p>'))+
  group('许愿内容',full(input('标题','title',w?.title,true))+select('类别','category',storyCategories,w?.category)+select('优先级','priority',storyPriorities,w?.priority||'3',true)+full(area('许愿描述','desc',w?.desc,true))+full(area('验收标准','verify',w?.verify)))+
  group('反馈来源',input('客户／提出者','customer',w?.customer)+select('来源','source',storySources,w?.source)+full(input('来源备注','sourceNote',w?.sourceNote)))+
  '<div id="wishError" role="alert"></div><div class="actions"><button class="primary" type="submit">保存</button><button id="formBack" type="button">返回</button></div></form></section>';
 const editor=app.querySelector('#wishForm');
 initPickers(editor);
 const product=editor.elements.product;
 const update=()=>app.querySelector('#assignee').textContent=product.value?(w?'当前负责人：'+w.owner:'预计负责人：'+(products[product.value]||currentUser)):'选择产品后显示预计负责人';
 product.onchange=()=>{
  setOptions(editor.elements.module,modules[product.value]||[]);
  update();
 };
 update();
 app.querySelector('#formBack').onclick=back;
 editor.onsubmit=e=>{
  e.preventDefault();
  const data=Object.fromEntries(new FormData(editor));
  if(!data.title.trim()||!data.desc.trim()){app.querySelector('#wishError').textContent='请填写标题和许愿描述。';return}
  if(w){Object.assign(w,data,{date:today});w.history.push(currentUser+'更新了许愿');detail(w)}
  else{const entry={...data,id:Math.max(...wishes.map(x=>x.id))+1,owner:products[data.product]||currentUser,reporter:currentUser,date:today,status:'待评估',links:{},history:[currentUser+'登记了许愿']};wishes.unshift(entry);detail(entry)}
  notice.textContent='许愿已保存';
 };
}
function closeWish(w){
 const candidates=wishes.filter(item=>item.id!==w.id&&item.product===w.product);
 const duplicateOptions=candidates.map(item=>'<option value="'+item.id+'">#'+item.id+' '+esc(item.title)+'</option>').join('');
 const reasons=Object.entries(closeReasons).map(([key,label])=>'<option value="'+key+'">'+label+'</option>').join('');
 const openTask=w.links.任务?.open===true;
 modal('关闭许愿','<label>'+fieldLabel('关闭原因',true)+'<select name="reason" required><option value="">请选择</option>'+reasons+'</select></label>'+
  '<div id="duplicateField" hidden>'+picker('重复许愿','duplicateID','<option value="">请选择同产品许愿</option>'+duplicateOptions,true)+
  (candidates.length?'':'<p class="muted">当前产品没有其他可选许愿。</p>')+'</div>'+
  area('备注','note')+
  (openTask?'<p role="status">承接任务 #'+w.links.任务.id+' 尚未完成，关闭许愿后该任务继续办理。</p>':''),
  data=>{
   if(w.status==='已关闭')return '该许愿已关闭。';
   if(!Object.hasOwn(closeReasons,data.reason))return '请选择关闭原因。';
   const duplicate=candidates.find(item=>item.id===Number(data.duplicateID));
   if(data.reason==='duplicate'&&!duplicate)return '请选择同产品的另一条许愿。';
   if(openTask&&!window.confirm('承接任务尚未完成，确认继续关闭许愿？'))return '已取消关闭，可继续修改。';
   w.status='已关闭';
   w.date=today;
   w.closure={reason:data.reason,duplicateID:duplicate?.id,comment:data.note.trim(),by:currentUser,date:today};
   w.history.push(currentUser+'关闭了许愿：'+closeReasons[data.reason]+(duplicate?'（重复于 #'+duplicate.id+'）':'')+(w.closure.comment?'。'+w.closure.comment:''));
   detail(w);notice.textContent='许愿已关闭';
  },'关闭许愿');
 form.elements.duplicateID.disabled=true;
 form.elements.reason.onchange=()=>{
  const show=form.elements.reason.value==='duplicate';
  const duplicate=form.elements.duplicateID;
  document.querySelector('#duplicateField').hidden=!show;
  duplicate.disabled=!show;
  duplicate.required=show;
  if(!show){duplicate.value='';duplicate.dispatchEvent(new Event('change',{bubbles:true}))}
 };
}
function handle(w,action){
 if(action==='编辑'){wishForm(w);return}
 if(action==='关闭'){closeWish(w);return}
 const handing=action==='转交';
 modal(handing?'指派许愿':'激活许愿',
  select('指派给','owner',people,handing?w.owner:(w.closure?.by||w.owner),true)+area('备注','note'),data=>{
  if(!people.includes(data.owner))return '请选择有效的负责人。';
  w.owner=data.owner;
  if(!handing){w.status='跟进中';delete w.closure}
  w.date=today;
  w.history.push(currentUser+(handing?'指派许愿给':'激活许愿并指派给')+data.owner+(data.note?'：'+data.note:''));
  detail(w);notice.textContent=handing?'许愿已指派':'许愿已激活';
 });
}
function conversion(w,target){
 const existing=w.links[target];
 if(existing){
 modal(target+' #'+existing.id,'<p>'+esc(existing.title)+'</p><p class="muted">已建立承接关系 · 来源许愿 #'+w.id+'</p>',()=>null,'完成');return
 }
 const name=input(['待办','任务'].includes(target)?'名称':'标题','title',w.title,true);
 const product=select('所属产品','product',Object.keys(products),w.product,true);
 const note=area(({Bug:'复现步骤',需求:'需求描述'})[target]||'描述','desc',w.desc);
 const byTarget={
  反馈:product+name+select('反馈类型','type',['建议','问题','需求'],'建议')+input('反馈者','customer',w.customer)+input('来源','source',[storySources[w.source],w.sourceNote].filter(Boolean).join(' · ')),
  Bug:product+name+select('影响版本','build',builds[w.product]||{},'',true)+select('严重程度','severity',['1','2','3','4'],'3'),
  工单:product+select('所属模块','module',w.product==='库存管理'?['库存查询','库存导出']:['工单处理','客户档案'],'',true)+name,
  待办:input('日期','date',today,true,'date')+name+select('可见范围','visibility',['仅本人','按待办权限可见'],'仅本人'),
  需求:product+name+select('类别','category',storyCategories,w.category||'feature')+select('来源','source',storySources,w.source)+input('来源备注','sourceNote',w.sourceNote),
  任务:select('所属执行','execution',w.product==='库存管理'?['库存管理 · 11 月迭代']:['客户服务 · 11 月迭代'],'',true)+name+select('指派给','owner',['林然','王晓','陈晨'])+input('预计开始','start','',false,'date')+input('截止日期','end','',false,'date')
 };
 modal('转'+target,(['反馈','工单'].includes(target)?'<p class="muted">正式接入需启用禅道'+target+'模块。这里可以模拟完整操作。</p>':'')+byTarget[target]+note+(target==='需求'?area('验收标准','verify',w.verify):''),data=>{
 if(!data.title.trim())return '请填写标题或名称。';
 if(data.start&&data.end&&data.end<data.start)return '截止日期不能早于预计开始。';
 if(w.links[target])return '已有同类型承接单据，请查看原转单结果。';
 w.links[target]={...data,id:++nextTarget,open:target==='任务'};
 w.status='跟进中';w.date=today;
 w.history.push(currentUser+'模拟创建了'+target+' #'+nextTarget);
 detail(w,'承接单据');notice.textContent='已模拟创建'+target+' #'+nextTarget;
 },'模拟创建'+target);
 if(target==='工单'||target==='Bug'){
  const productField=form.elements.product;
  const dependent=target==='工单'?form.elements.module:form.elements.build;
  const candidates=target==='工单'?modules:builds;
  productField.onchange=()=>setOptions(dependent,candidates[productField.value]||[]);
 }
}
document.querySelector('#poolNav').onclick=list;
list();
</script>
</html>
