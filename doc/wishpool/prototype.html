.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button,input,select,textarea{font:inherit;min-height:32px;border:1px solid #d4dae3;border-radius:4px;padding:4px 10px;background:#fff;color:inherit}button{cursor:pointer}button:hover{filter:brightness(.96)}.link{border:0;background:transparent;color:#1b6de2;text-align:left;padding:3px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:8px 10px;text-align:left;border-bottom:1px solid #e7edf4}th{background:#f1f3f5;color:var(--ink);font-weight:600}tbody tr:hover{background:#f5f9ff}.pill{display:inline-flex;gap:5px;align-items:center;color:var(--muted)}.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:#ffad32}.pill[data-state="跟进中"]::before{background:var(--blue)}.pill[data-state="已关闭"]::before{background:#97a1b1}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(235px,1fr);gap:12px}.browse{display:grid;grid-template-columns:205px minmax(0,1fr);gap:12px;align-items:start}.browse .panel{min-width:0}.tree ul{list-style:none;padding:0;margin:4px 0}

.tabs button{border:0;border-radius:0;border-bottom:2px solid transparent}.tabs button[aria-pressed=true]{color:#1b6de2;border-bottom-color:var(--blue);font-weight:600}.count{padding:10px}.record-title{justify-content:flex-start}.record-title h1,.section p{overflow-wrap:anywhere}.section{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}.section:last-child{border:0;margin:0}.detail-tabs{border-bottom:1px solid var(--line);margin-bottom:13px}
dl{margin:0;display:grid;grid-template-columns:88px 1fr;gap:10px}dt{color:var(--muted)}dd{margin:0;min-width:0;overflow-wrap:anywhere}
.dock{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:#151a23d9;color:#fff;border-radius:4px;padding:5px;backdrop-filter:blur(8px);box-shadow:0 4px 12px #26354840}.dock button,.dock summary{background:transparent;color:inherit;border:0;padding:6px 9px;cursor:pointer}.dock button:hover,.dock summary:hover{background:#3c4d62}.dock details{position:relative}.dock-menu{position:absolute;right:0;bottom:calc(100% + 9px);background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:5px;min-width:145px;box-shadow:0 5px 15px #26354830}.dock-menu button{display:block;text-align:left;width:100%}.dock-menu button:hover{background:#eaf2ff}
#wish-modal .form-error{color:#9d261a}
#wish-modal .modal-body{min-width:0}
#wish-modal .actions{margin-top:12px}
label{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start;margin:7px 0;min-width:0}
label span{text-align:right;padding-top:6px}
label input,label select,label textarea{width:100%;min-width:0}
label b{color:#df3444;font-weight:400}textarea{min-height:80px;resize:vertical}form .actions{justify-content:flex-end;margin-top:15px}#notice:not(:empty){padding:6px 10px;background:#e8f6ef;color:#17573d;margin-bottom:9px}#error{color:#9d261a}.editor{max-width:1000px;margin:0 auto;padding:16px 20px}.editor h1{padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}.editor .actions{justify-content:flex-start;margin-left:98px}.form-group{border:0;border-bottom:1px solid var(--line);margin:0 0 15px;padding:0 0 12px;min-width:0}.form-group legend{font-weight:650}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}
@media(max-width:720px){.grid,.browse,.form-grid{grid-template-columns:1fr}.dock{justify-content:center}main{padding-inline:10px}}
.wish-picker{min-width:0;margin:7px 0}
.picker-row{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start}
.picker-row>span{text-align:right;padding-top:6px}.picker-row b{color:#df3444;font-weight:400}
.picker-control{min-width:0}
.picker-control>select{position:absolute;width:1px;height:1px;min-height:0;opacity:0;pointer-events:none}
.picker-label{display:block;margin-bottom:5px}
.picker-label b{color:#df3444;font-weight:400}
.scope-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:end;margin-bottom:8px}

.scope-pair .wish-picker,.scope-plan .wish-picker{margin:0}
.scope-plan{display:flex;gap:8px;align-items:end;min-width:0}.scope-plan>.picker-field{flex:1;min-width:0}
.scope-pair>div:first-child .picker-select{border-radius:4px 0 0 4px}
.scope-pair>div+div .picker-control{margin-left:-1px}
.scope-pair>div+div .picker-select{border-radius:0 4px 4px 0}
.scope-head{display:block;margin-bottom:5px}
.editor label,.editor .picker-row{grid-template-columns:minmax(0,1fr);gap:5px}
.editor label>span,.editor .picker-row>span{text-align:left;padding-top:0}
.editor .actions{margin-left:0}
.scope-actions{white-space:nowrap}.scope-row button:disabled{cursor:default;opacity:.55}
@media(max-width:600px){.scope-row{grid-template-columns:minmax(0,1fr)}}

.fixed-options{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;min-height:32px}
.fixed-options .radio>label{display:block;text-align:left;margin:0}
.fixed-options input[type=radio]{min-height:0;width:auto}
.attachments .file-selector-box{display:flex;justify-content:center;align-items:center;min-height:46px}
.attachments .file-selector-item label,.attachment-links .checkbox>label{display:block;text-align:left;margin:0}
.attachment-links .checkbox{margin:4px 0}
.attachment-links .checkbox input{min-height:0;width:auto}
.attachment-links .checkbox>label{overflow-wrap:anywhere}
</style>

<script>
const app=document.querySelector('#app'), notice=document.querySelector('#notice');
const products={'库存管理':'王晓','客户服务':'陈晨','ERP':'王晓','集成网关':'陈晨'};
const productScopes={
 '库存管理':{type:'normal',branches:{'0':{modules:{'101':'/库存/库存查询','102':'/库存/库存导出'},plans:{'501':'库存优化'}}}},
 '客户服务':{type:'normal',branches:{'0':{modules:{'201':'/服务/工单处理','202':'/服务/客户档案'},plans:{'502':'客服体验优化'}}}},
 'ERP':{type:'platform',branches:{
  '0':{label:'主干',modules:{'301':'/主干/销售/新建订单','302':'/主干/销售/新建订单/订单导入','303':'/主干/销售/新建订单/订单下载','304':'/主干/仓储/订单导入'},plans:{'503':'ERP 主干发布'}},
  '11':{label:'iOS',modules:{'311':'/iOS/销售/订单导入','312':'/iOS/库存/订单导入'},plans:{'511':'ERP iOS 发布'}},
  '12':{label:'Android',modules:{'321':'/Android/销售/订单导入'},plans:{'512':'ERP Android 发布'}},
  '13':{label:'Web',modules:{'331':'/Web/销售/订单查询'},plans:{'513':'ERP Web 发布'}}
 }},
 '集成网关':{type:'branch',branches:{
  '0':{label:'主干',modules:{'401':'/主干/集成/接口管理'},plans:{'504':'网关主干发布'}},
  '21':{label:'维护分支',modules:{'411':'/维护分支/集成/接口管理'},plans:{'521':'维护版本发布'}},
  '22':{label:'试验分支',modules:{'421':'/试验分支/集成/接口管理'},plans:{'522':'试验版本发布'}}
 }}
};
const builds={'库存管理':{'trunk':'trunk（主干）','21':'库存管理 22.7 测试构建'},'客户服务':{'trunk':'trunk（主干）','22':'客户服务 22.7 测试构建'}};
const storyTargets={'研发需求':'story','业务需求':'epic','用户需求':'requirement'};
// The static preview uses sample settings. The plugin reads these flags from ZenTao before rendering and submitting.
const previewSettings=new URLSearchParams(location.search);
const storyAvailable=type=>type==='story'||(type==='epic'?previewSettings.get('enableER'):previewSettings.get('URAndSR'))!=='0';
const targets=['Bug','待办','研发需求',...Object.keys(storyTargets).filter(name=>name!=='研发需求'&&storyAvailable(storyTargets[name])),'任务'];
const states=['待评估','跟进中','已关闭'];
const closeReasons={done:'已完成',duplicate:'重复',postponed:'延期',willnotdo:'不做',cancel:'已取消',bydesign:'设计如此'};
const people=['王晓','陈晨','林然'];
// Illustrative copies of the native story dictionaries for this offline prototype.
const storySources={customer:'客户',user:'用户',po:'产品经理',market:'市场',service:'客服',operation:'运营',support:'技术支持',competitor:'竞争对手',partner:'合作伙伴',dev:'开发人员',tester:'测试人员',bug:'Bug',forum:'论坛',other:'其他'};
const storyCategories={feature:'功能',interface:'接口',performance:'性能',safe:'安全',experience:'体验',improve:'改进',other:'其他'};
const taskTypes={design:'设计',devel:'开发',request:'需求',test:'测试',study:'研究',discuss:'讨论',ui:'界面',affair:'事务',misc:'其他'};
const bugTypes={codeerror:'代码错误',config:'配置相关',install:'安装部署',security:'安全相关',performance:'性能问题',standard:'标准规范',automation:'测试脚本',designdefect:'设计缺陷',codeimprovement:'代码改进',others:'其他'};
const storyPriorities={'1':'1','2':'2','3':'3','4':'4'};
const currentUser='林然';
const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'});
const wishes=[
 {id:104,scopes:[{branch:'0',module:'102',plan:''}],title:'库存导出支持按仓库筛选',product:'库存管理',customer:'华东仓储',source:'customer',sourceNote:'客户拜访',desc:'导出库存时，希望先选择仓库，以便仓库主管查看各自的数据。',verify:'导出结果仅包含所选仓库的库存。',owner:'王晓',reporter:'林然',priority:'1',category:'feature',status:'待评估',date:'2026-11-20',links:{},history:['林然登记了许愿']},
 {id:103,scopes:[{branch:'0',module:'201',plan:''}],title:'工单详情展示最近一次答复',product:'客户服务',customer:'南区服务团队',source:'service',sourceNote:'群聊',desc:'客服接手工单时需要快速看到上一位同事的答复。',verify:'详情中能看到最近答复和时间。',owner:'林然',reporter:'陈晨',priority:'2',category:'experience',status:'跟进中',date:'2026-11-19',links:{研发需求:{id:62,title:'工单详情展示最近一次答复'}},history:['陈晨创建了研发需求 #62']},
 {id:102,scopes:[{branch:'0',module:'101',plan:''}],title:'库存列表默认显示可用数量',product:'库存管理',customer:'北区仓储',source:'customer',sourceNote:'电话',desc:'希望进页面即可看到可用库存。',verify:'默认列包含可用库存。',owner:'王晓',reporter:'林然',priority:'3',category:'improve',status:'已关闭',date:'2026-11-18',closure:{reason:'done',comment:'已指导开启可用库存列，客户确认。',by:'王晓',date:'2026-11-18'},links:{},history:['王晓记录答复并关闭许愿']}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='全部', filters={product:'',module:'',status:'',search:''}, nextTarget=200;
const options=(values,selected='')=>values.map(v=>'<option'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('');
function buildModuleTree(product){
 const root={name:product,key:'',ids:[],children:new Map()};
 for(const branch of Object.values(productScopes[product].branches)){
  for(const [id,path] of Object.entries(branch.modules)){
   let node=root;
   for(const name of path.split('/').filter(Boolean)){
    if(!node.children.has(name))node.children.set(name,{name,key:node.key+'/'+name,ids:[],children:new Map()});
    node=node.children.get(name);
    node.ids.push(id);
   }
  }
 }
 return root;
}
const moduleTrees=Object.fromEntries(Object.keys(products).map(product=>[product,buildModuleTree(product)]));
const collapsedNodes=new Set(Object.entries(moduleTrees).flatMap(([product,node])=>{
 if(productScopes[product].type==='normal')return [];
 return [product+':',...Array.from(node.children.values()).filter(child=>child.name!=='主干').map(child=>product+':'+child.key)];
}));
function renderModuleNode(product,node){
 const selected=filters.product===product&&filters.module===node.key;
 const button='<button type="button" class="tree-node" data-product="'+esc(product)+'" data-module="'+esc(node.key)+'" data-ids="'+node.ids.join(',')+'" aria-pressed="'+selected+'">'+esc(node.name)+'</button>';
 if(!node.children.size)return '<li>'+button+'</li>';
 const key=esc(product+':'+node.key);
 const children=Array.from(node.children.values(),child=>renderModuleNode(product,child)).join('');
 return '<li><details data-tree-key="'+key+'" '+(collapsedNodes.has(product+':'+node.key)?'':'open')+'><summary>'+button+'</summary><ul>'+children+'</ul></details></li>';
}
function list(){
 destroyWidgets(app);
 const all='<button type="button" class="tree-node" data-product="" data-module="" data-ids="" aria-pressed="'+!filters.product+'">所有产品</button>';
 const tree='<ul>'+Object.entries(moduleTrees).map(([product,node])=>renderModuleNode(product,node)).join('')+'</ul>';
 app.innerHTML=
  '<div class="feature"><div class="actions tabs">'+['全部','我提交的','待我处理'].map(t=>'<button data-tab="'+t+'" aria-pressed="'+(tab===t)+'">'+t+'</button>').join('')+'<button id="toggleSearch" aria-expanded="false">搜索</button></div><button class="primary" id="new">＋ 提交许愿</button></div>'+
  '<div class="browse"><aside class="panel tree"><h2>产品模块</h2>'+all+tree+'</aside>'+
  '<section class="panel"><div id="searchPanel" hidden><div class="filters"><select aria-label="状态" id="statusFilter"><option value="">所有状态</option>'+options(states,filters.status)+'</select><input aria-label="搜索" id="search" placeholder="编号、标题、客户" value="'+esc(filters.search)+'"><button id="apply">筛选</button><button id="clear">清除</button></div></div><div class="scroll"><table><thead><tr><th>编号</th><th>优先级</th><th>标题</th><th>产品</th><th>客户</th><th>状态</th><th>负责人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div id="count" class="muted count"></div></section></div>';
 const rows=wishes.filter(w=>(tab==='全部'||(tab==='我提交的'?w.reporter===currentUser:w.owner===currentUser&&w.status!=='已关闭'))&&(!filters.product||w.product===filters.product)&&(!filters.module||w.scopes.some(scope=>filters.moduleIDs.includes(scope.module)))&&(!filters.status||w.status===filters.status)&&(w.id+' '+w.title+' '+w.customer).includes(filters.search));
 app.querySelector('#rows').innerHTML=rows.map(w=>'<tr><td>'+w.id+'</td><td>'+esc(w.priority)+'</td><td><button class="link" data-id="'+w.id+'">'+esc(w.title)+'</button></td><td>'+esc(w.product)+'</td><td>'+esc(w.customer)+'</td><td><span class="pill" data-state="'+w.status+'">'+w.status+'</span></td><td>'+esc(w.owner)+'</td><td>'+w.date+'</td><td>'+(w.status==='已关闭'?'': '<button class="link" data-edit="'+w.id+'" aria-label="编辑许愿 '+w.id+'">编辑</button>')+'</td></tr>').join('')||'<tr><td colspan="9">没有符合条件的许愿</td></tr>';
 app.querySelector('#count').textContent='共 '+rows.length+' 条许愿';
 const searchToggle=app.querySelector('#toggleSearch');
 const searchPanel=app.querySelector('#searchPanel');
 const toggle=open=>{searchPanel.hidden=!open;searchToggle.setAttribute('aria-expanded',String(open))};
 toggle(Boolean(filters.search||filters.status));
 searchToggle.onclick=()=>toggle(searchPanel.hidden);
 app.querySelector('#new').onclick=()=>wishForm();
 app.querySelector('#apply').onclick=()=>{filters.status=app.querySelector('#statusFilter').value;filters.search=app.querySelector('#search').value.trim();list()};
 app.querySelector('#clear').onclick=()=>{filters.status='';filters.search='';list()};
 app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;list()});
 app.querySelectorAll('[data-tree-key]').forEach(node=>node.ontoggle=()=>{
  const key=node.dataset.treeKey;
  if(node.open)collapsedNodes.delete(key);else collapsedNodes.add(key);
 });
 app.querySelectorAll('[data-product]').forEach(b=>b.onclick=e=>{
  e.preventDefault();
  filters.product=b.dataset.product;filters.module=b.dataset.module;filters.moduleIDs=b.dataset.ids.split(',');
  collapsedNodes.delete(b.dataset.product+':'+b.dataset.module);
  list();
 });
 app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(wishes.find(w=>w.id===Number(b.dataset.id))));
 app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>wishForm(wishes.find(w=>w.id===Number(b.dataset.edit)),list));
}
function detail(w, active='基本信息'){
 destroyWidgets(app);
 const closed=w.status==='已关闭';
 const closure=w.closure;
 const duplicate=wishes.find(item=>item.id===closure?.duplicateID);
 const closureText=closure?[closeReasons[closure.reason],duplicate?'重复于 #'+duplicate.id+' '+duplicate.title:'',closure.by+' · '+closure.date,closure.comment].filter(Boolean).join(' ｜ '):'';
 const fields=Object.entries({'产品':w.product,'所属范围':w.scopes.map(scope=>scopeLabel(w.product,scope)).join('；'),'客户':w.customer,'来源':storySources[w.source],'来源备注':w.sourceNote,'类别':storyCategories[w.category],'优先级':w.priority,'提报人':w.reporter,'指派给':closed?'已关闭':w.owner});
 const related=targets.filter(t=>w.links[t]).map(t=>'<p><button class="link" data-related="'+t+'">'+t+' #'+w.links[t].id+' · '+esc(w.links[t].title)+'</button></p>').join('');
 const section=(heading,body)=>'<div class="section"><h2>'+heading+'</h2>'+body+'</div>';
 const description=(heading,value)=>section(heading,'<p>'+esc(value)+'</p>');
 app.innerHTML='<div class="bar record-title"><button class="link" id="back">← 返回许愿列表</button><span class="muted">#'+w.id+'</span><h1>'+esc(w.title)+'</h1><span class="pill" data-state="'+w.status+'">'+w.status+'</span></div>'+
  '<div class="grid"><section class="panel">'+description('许愿描述',w.desc||'暂无描述')+description('验收标准',w.verify||'待补充')+section('附件',attachmentList(w.attachments))+(closure?description('关闭记录',closureText):'')+section('历史记录',w.history.map(h=>'<p>'+esc(h)+'</p>').join(''))+'</section>'+

function initPickers(root){
 root.querySelectorAll('.picker-mount').forEach(host=>{
  const field=host.previousElementSibling;
  const render=()=>{
   pickerMounts.get(host)?.destroy();
   const items=Array.from(field.options).filter(option=>option.value!=='').map(option=>({
    value:option.value,text:option.text,disabled:option.disabled,keys:option.value
   }));
   const widget=new zui.Picker(host,{
    items,defaultValue:field.multiple?Array.from(field.selectedOptions,o=>o.value):field.value,
    required:field.required,multiple:field.multiple,search:true,popWidth:'100%',
    placeholder:field.options[0]?.text||'请选择',searchEmptyHint:'无匹配选项',
    popContainer:host.closest('#wish-modal')?'#wish-modal':undefined,
    onChange:value=>{
     const next=(Array.isArray(value)?value:String(value??'').split(',')).map(String);
     if(field.multiple){
      for(const option of field.options)option.selected=next.includes(option.value);
     }else{
      if(next[0]===field.value)return;
      field.value=next[0]||'';
     }
     queueMicrotask(()=>{if(field.isConnected)field.dispatchEvent(new Event('change',{bubbles:true}))});
    }
   });
   pickerMounts.set(host,widget);
  };
  host.addEventListener('keydown',e=>{
   if(e.key!=='Escape'||!host.querySelector('.picker-select.is-open'))return;
   e.preventDefault();
   e.stopPropagation();
   pickerMounts.get(host)?.$?.close();
  });
  field.addEventListener('invalid',e=>{
   e.preventDefault();
   host.querySelector('.picker-select')?.click();
  });
  field.addEventListener('wish-options-change',render);
  render();
 });
}

    form.onsubmit=async e=>{
     e.preventDefault();
     const submit=form.querySelector('[type="submit"]');

     submit.disabled=true;
     try{
      const values=new FormData(form);
      const fields=Object.fromEntries(values);

     }finally{submit.disabled=false}
